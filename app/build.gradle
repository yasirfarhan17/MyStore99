apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin:  'kotlin-android'
apply plugin:  'kotlin-parcelize'
apply plugin:  'kotlin-kapt'
apply plugin:  'dagger.hilt.android.plugin'

android {
    namespace "com.noor.mystore99"
    compileSdkVersion 36
    buildToolsVersion '30.0.3'

    defaultConfig {
        applicationId "com.noor.mystore99"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 20
        versionName "1.18"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
        lintOptions {
            checkReleaseBuilds false

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
    dataBinding{
        enabled true
    }
    buildFeatures {
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation(project(":NetworkModule"))

    //implementation fileTree(dir: 'libs', include: ['*.jar'])

    //
    implementation 'androidx.core:core-ktx:1.17.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Coroutine Lifecycle Scopes
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"

    //Dagger - Hilt
    implementation "com.google.dagger:hilt-android:2.57.2"
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation project(path: ':NetworkModule')
    kapt "com.google.dagger:hilt-android-compiler:2.57.2"
    implementation "androidx.hilt:hilt-lifecycle-viewmodel:1.3.0"
    kapt "androidx.hilt:hilt-compiler:1.3.0"
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'

    implementation 'androidx.browser:browser:1.9.0'



    //TODO remove
    implementation 'com.github.d-max:spots-dialog:0.7'

    //legacy
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    //new
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'

    //multidex
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.android.support:multidex:1.0.3'

    //testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    //library
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.skyfishjy.ripplebackground:library:1.0.1'
    implementation 'com.karumi:dexter:6.2.3'
    implementation 'com.rengwuxian.materialedittext:library:2.1.4'



    implementation("io.coil-kt:coil:2.7.0")
    //qr code
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    //swiper
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'


    //firebase
    implementation 'com.google.firebase:firebase-auth:24.0.1'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation 'com.google.firebase:firebase-database:22.0.1'
    implementation 'com.google.firebase:firebase-storage:22.0.1'


    //design
    implementation 'androidx.cardview:cardview:1.0.0'
    //noinspection GradleCompatible
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    //noinspection GradleCompatible
    implementation 'com.android.support:design:28.0.0'


    //navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.6'

    //glide
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    implementation files('libs/activation.jar')
    implementation files('libs/additionnal.jar')
    implementation files('libs/mail.jar')

    //lottie
    implementation 'com.airbnb.android:lottie:6.7.1'




    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-scalars:3.0.0'
    implementation "com.squareup.retrofit2:adapter-rxjava2:3.0.0"


    //firebase
    implementation 'com.google.android.gms:play-services-places:17.1.0'
    implementation 'com.google.firebase:firebase-auth:24.0.1'
    implementation 'com.firebase:geofire-android:3.2.0'
    implementation 'com.google.firebase:firebase-database:22.0.1'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.firebase:firebase-messaging:25.0.1'



    //navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.6'

    //coil
    implementation "io.coil-kt:coil:2.7.0"
    implementation("io.coil-kt:coil-gif:2.7.0")


    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.3.0"

    implementation 'androidx.browser:browser:1.9.0'

    implementation 'com.google.zxing:core:3.5.4'

    implementation 'com.google.firebase:firebase-messaging:19.0.1'
    implementation 'com.android.volley:volley:1.2.1'
}
repositories {
    mavenCentral()
}
